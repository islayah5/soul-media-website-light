<svg id="soul-media-svg" width="600" height="260" viewBox="0 0 600 260" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Vibrant Baby Pink Gradient -->
        <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#ffdae0;stop-opacity:1" />
            <stop offset="50%" style="stop-color:#ffdae0;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#ef9da3;stop-opacity:1" />
        </linearGradient>

        <!-- Specular Shine Filter -->
        <filter id="glassShine" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="0.8" result="blur" />
            <feSpecularLighting in="blur" surfaceScale="5" specularConstant="1" specularExponent="45" lighting-color="#ffffff" result="shine">
                <fePointLight x="-5000" y="-10000" z="20000" />
            </feSpecularLighting>
            <feComposite in="shine" in2="SourceAlpha" operator="in" result="shine" />
            <feComposite in="SourceGraphic" in2="shine" operator="over" />
        </filter>

        <filter id="softGlow">
            <feGaussianBlur stdDeviation="2.5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>

    <!-- Main Logo Group -->
    <g fill="url(#mainGradient)" filter="url(#softGlow)">
        
        <!-- Word: Soul -->
        <g transform="translate(125, 115)">
            <!-- S -->
            <text x="0" y="0" font-size="105" font-weight="700" font-family="Comfortaa, 'Century Gothic', 'Trebuchet MS', 'Arial Rounded MT Bold', Verdana, sans-serif">S</text>
            
            <!-- The 'o' Play Button -->
            <g transform="translate(59, -55)" filter="url(#glassShine)">
                <circle cx="30" cy="28" r="28" fill="url(#mainGradient)" />
                <path d="M25 18 L40 28 L25 38 Z" fill="white" />
            </g>

            <!-- u -->
            <text x="120" y="0" font-size="105" font-weight="700" font-family="Comfortaa, 'Century Gothic', 'Trebuchet MS', 'Arial Rounded MT Bold', Verdana, sans-serif">u</text>
            
            <!-- l -->
            <text x="187" y="0" font-size="105" font-weight="700" font-family="Comfortaa, 'Century Gothic', 'Trebuchet MS', 'Arial Rounded MT Bold', Verdana, sans-serif">l</text>
        </g>

        <!-- Word: Media - uniform spacing -->
        <g transform="translate(125, 215)" opacity="1.0">
            <!-- Media with uniform spacing between all characters -->
            <text x="0" y="0" font-size="60" font-weight="600" font-family="Comfortaa, 'Century Gothic', 'Trebuchet MS', 'Arial Rounded MT Bold', Verdana, sans-serif">M</text>
            <text x="50" y="0" font-size="60" font-weight="600" font-family="Comfortaa, 'Century Gothic', 'Trebuchet MS', 'Arial Rounded MT Bold', Verdana, sans-serif">e</text>
            <text x="90" y="0" font-size="60" font-weight="600" font-family="Comfortaa, 'Century Gothic', 'Trebuchet MS', 'Arial Rounded MT Bold', Verdana, sans-serif">d</text>
            
            <!-- 'i' with Centered Camera Dot (camera perfectly aligned over stem) -->
            <g transform="translate(141, -45)">
                <!-- Stem of 'i' -->
                <rect x="0" y="8" width="12" height="37" rx="6" />
                <!-- Camera Dot (centered over stem) -->
                <g transform="translate(-11, -32) scale(0.85)" filter="url(#glassShine)">
                    <rect x="0" y="6" width="40" height="28" rx="8" fill="url(#mainGradient)" />
                    <circle cx="20" cy="20" r="8" fill="white" />
                    <circle cx="20" cy="20" r="4" fill="url(#mainGradient)" />
                    <rect x="25" y="0" width="10" height="6" rx="2" fill="url(#mainGradient)" />
                </g>
            </g>
            
            <!-- a (positioned for uniform spacing) -->
            <text x="169" y="0" font-size="60" font-weight="600" font-family="Comfortaa, 'Century Gothic', 'Trebuchet MS', 'Arial Rounded MT Bold', Verdana, sans-serif">a</text>
        </g>
    </g>
</svg>
